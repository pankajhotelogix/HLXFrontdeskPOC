<app-header-bar></app-header-bar>
<div class="control-section" id="sidebarmenu">
    <div class="main-menu-content" id="maintext">
        <div class="menu-content">
            <app-calendar></app-calendar>
        </div>
        <ejs-sidebar id="menuSidebar" class="sidebar-menu" #sidebarMenuInstance [enableDock]="enableDock"
            [dockSize]="dockSize" [width]="width" [target]="target" [isOpen]="false" type="false">
            <div class="main-menu">
                <div>
                    <ejs-toolbar id="menuToolbar" (clicked)="toolbarCliked($event)">
                        <e-items>
                            <e-item prefixIcon="icon-menu" tooltipText="Menu"></e-item>
                            <e-item>
                         <ng-template #template>
                          <div class="e-folder">
                            <div class="e-folder-name">Navigation</div>
                          </div>
                        </ng-template>
                            </e-item>
                        </e-items>
                    </ejs-toolbar>
                    <ejs-menu id="dockMenu" [items]="menuItems" orientation="Vertical" cssClass="dock-menu"></ejs-menu>
                </div>
            </div>
        </ejs-sidebar>
    </div>
