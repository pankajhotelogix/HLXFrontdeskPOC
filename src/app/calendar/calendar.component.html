<style>
  .srk-card {
    background: linear-gradient(135deg,
        #004e92,
        #000428);
    border-radius: 10px;
  }

  .logo img {
    width: 75px;
    margin-bottom: 12px;
    display: block;
    max-width: 100%;
    margin: auto;
  }

  .logo figcaption {
    background-color: rgb(249, 249, 249);
    padding: 4px 5px;
    text-align: center;
    border-radius: 5px;
    color: #333333a3;
    font-weight: 500;
  }
</style>
<div class="e-sample-resize-container">
  <ejs-tab #tabObj id="tab_orientation" loadOn="Dynamic" [animation]="tabAnimation" [showCloseButton]='enableClose' >
    <e-tabitems>
      <e-tabitem *ngFor="let tab of tabItems; let i = index" [header]="tab.header" >
        <ng-template #content>
          <ng-container *ngIf="tab.content === 'schedule'">
          <div class="planner-calendar">
            <div class="doctor-container" style="display:none">
              <div class="app-doctors"></div>
              <div class="app-doctor-icon">
              </div>
            </div>
            <div class="drag-sample-wrapper droppable">
              <div class="schedule-container">
                <div class="title-container" style="display: flex; justify-content: flex-end; align-items: center;">

                  <div class="d-flex justify-center align-items ">
                    <div class="icon-bar" style="display: flex; margin-right: 10px; align-items: center; gap: 10px;">
                      <div>
                    
                        <ejs-dropdownlist id='header-styles' width='90%' #styles [dataSource]='dataStyles' (change)='styleChange($event)' [value]='styleValue' [fields]='styleFields'>
                        </ejs-dropdownlist>

                      </div>
                      <div>
                        <button ejs-button iconCss="e-btn-sb-icon e-prev-icon" (click)="navigateDate(-7)">
                          Pre
                        </button>
                        <button ejs-button iconCss="e-btn-sb-icon e-prev-icon rotate-icon" (click)="navigateDate(7)">
                          Next
                        </button>
                        <button (click)="generateReservations()">Import</button>
                      </div>
                      <div>
                        <img src="assets/Icons/refresh.svg" alt="" class="icon-refresh icon">
                      </div>
                      <div style="width: 1px;height: 30px;background: #cacaca;">
                        &nbsp;
                      </div>
                      <div>
                        <img src="assets/Icons/anchor.svg" alt="" class="icon-anchor icon">
                      </div>
                    </div>
                    <div class="view-selector" style=" width: 117px;">
                      <ejs-dropdownlist id="scheduleview" [dataSource]="datas" [(value)]="dropDownValue"
                        floatLabelType="Always" (change)="onViewChange($event)">
                      </ejs-dropdownlist>
                    </div>
                  </div>
                </div>

                <div id="main">
                  <div
                    style="background-color: rgb(3, 1, 1); color: aliceblue; padding-top: 2px; padding-left: 4px; width: 128px;">
                    Blocked <i class="fa fa-info" style="padding-left: 58px;" aria-hidden="true"></i>
                  </div>
                  <div class="days-container">
                    <div class="day" *ngFor="let day of daysInMonth">0</div>
                  </div>
                </div>
                <ejs-schedule #scheduleObj height='800px' cssClass='doctor-appointment-planner'
                  [selectedDate]="selectedDate" [eventSettings]="eventSettings" [quickInfoOnSelectionEnd]=true
                  [currentView]="scheduleView" [allowMultiCellSelection]="true" [rowAutoHeight]="true"
                  [allowDragAndDrop]="true" [timeScale]="timeScale" (popupOpen)="onPopupOpen($event)"
                  [showHeaderBar]="false" (renderCell)="onRenderCell($event)" (hover)="onHover($event)" [group]="group"
                  (actionBegin)="onActionBegin($event)" (created)="onScheduleCreated()" 
                  (dragStart)="onDragStart($event)" (eventRendered)="onEventRendered($event)" >
                  <e-resources>
                    <e-resource field='DepartmentId' title='Department' name='Departments' query='resourceQuery'
                      [dataSource]='specialistCategory' textField='Text' idField='DepartmentId' colorField='Color'>
                    </e-resource>
                    <e-resource field='DoctorId' title='Consultation' name='Doctors' [dataSource]='resourceDataSource'
                      textField='Name' idField='Id' groupIDField='DepartmentId' colorField='Color'
                      workDaysField='AvailableDays' startHour='StartHour' endHour='EndHour' query='resourceQuery'>
                    </e-resource>
                  </e-resources>
                  <e-views>
                    <e-view option="TimelineDay" [interval]="1" displayName="1 Day"></e-view>
                    <e-view option="TimelineDay" [interval]="3" displayName="3 Day"></e-view>
                    <e-view option="TimelineDay" [interval]="15" displayName="15 Day"></e-view>
                    <e-view option="TimelineDay" [interval]="31" displayName="31 Day"></e-view>
                    <e-view option="TimelineWeek"></e-view>
                    <e-view option="TimelineMonth"></e-view>
                  </e-views>
                  <ng-template #headerIndentTemplate let-data>
                    <div class='e-resource-text ' style="display: flex; align-items: center; gap: 5px; height: 44px;">
                      <img src="assets/Icons/signal_cellular_alt.svg" style=" width:14px">
                      <span class="e-icons e-add"></span>
                      <p (click)="openDatePicker()"
                        style="cursor: pointer; color: #556faa; font-size: 13px; font-weight: bold; margin: 0;">{{
                        selectedDateRange }}
                      </p>
                      <ejs-datepicker #datepicker [value]='defaultStartDate' (change)="onChange()"
                        style="display: none;">
                      </ejs-datepicker>
                    </div>
                  </ng-template>
                  <ng-template #editorHeaderTemplate let-data>
                    <div *ngIf="data.Subject; else createNewEvent">
                      {{ data.Subject }}
                    </div>
                    <ng-template #createNewEvent>
                      <div style="display: flex; gap: 10px; justify-content: space-between;">
                        <label style="color: white;">Add Quick Reservation</label>
                        <div style="position: relative;">
                          <label style="color: white; text-align: end; padding-right: 13px; margin-top: 0px;">
                            {{ data.StartTime | date:'MMM dd' }} - {{ data.EndTime | date:'MMM dd' }}
                          </label>
                          <img src="./assets/Icons/calender.svg" alt="" (click)="openDateRangePicker()"
                            style="cursor: pointer;">
                          <ejs-daterangepicker #dateRangePicker [min]="minDate" [max]="maxDate"
                            style="visibility: hidden"></ejs-daterangepicker>
                        </div>
                      </div>
                    </ng-template>
                  </ng-template>

                  <ng-template #editorTemplate let-data>
                    <div class="popup-size">
                      <div class="room-details modal-reservation pt-3">
                        <div class="room-info popup-body-first-size">
                          <div class="room-name">
                            <img src="./assets/Icons/Vector.svg" alt="">
                            <select id="department" class="select-room pankaj-tag"
                              [(ngModel)]="requestParams.room_stay[0].room_type_id" (change)="getSessionalRateList()"
                              name="department">
                              <option value="" disabled>Select</option>
                              <option *ngFor="let category of specialistCategory" [value]="category['DepartmentId']">
                                {{ category['Text'] }}
                              </option>
                            </select>
                            <select id="room-type" class="select-room pankaj-tag" name="room-type"
                              [(ngModel)]="requestParams.room_stay[0].room_id">
                              <option value="" disabled>Select</option>
                              <option *ngFor="let room of vaccantRoomList" [value]="room.room_id">
                                {{ room.room_name }}
                              </option>
                            </select>
                          </div>
                          <div class="room-name" style="width: 183px;">
                            <input type="checkbox" id="assign" name="assign" [(ngModel)]="requestParams.isRoomAssigned">
                              <label for="assign" style="margin: 0px;">Assign</label>
                            <input type="checkbox" id="day-use" name="day-use">
                            <label for="day-use" style="margin: 0px; white-space: nowrap;">Day Use</label>
                          </div>
                        </div>
                        <div class="guest-rate-info popup-body-size">
                          <div class="guests">
                            <div style="width: 48%;">
                              <img src="./assets/Icons/user.svg" alt="" style="position: absolute; padding: 10px 25px;">
                              <select id="adults" class="user-icon pankaj-tag" [(ngModel)]="requestParams.adult"
                                name="adults" (change)="reloadBookingFare()">
                                <option [ngValue]="0">0</option>
                                <option [ngValue]="1">1</option>
                                <option [ngValue]="2">2</option>
                                <option [ngValue]="3">3</option>
                              </select>
                              <img src="./assets/Icons/child.svg" alt=""
                                style="position: absolute; padding: 10px 25px;">
                              <select id="children" class="user-icon pankaj-tag" [(ngModel)]="requestParams.child"
                                name="children" (change)="reloadBookingFare()">
                                <option [ngValue]="0">0</option>
                                <option [ngValue]="1">1</option>
                                <option [ngValue]="2">2</option>
                                <option [ngValue]="3">3</option>
                              </select>
                            </div>
                            <div style="width: 52%;">
                              <select id="rate" class="session-icon pankaj-tag" style="padding-left: 10px;" name="rate"
                                [(ngModel)]="requestParams.rate[0].rate_id" (change)="reloadBookingFare()">
                                <option value="" disabled>Select</option>
                                <option *ngFor="let rate of sessionalRate" [value]="rate.package_id">
                                  {{ rate.package_pkgname }}
                                </option>
                              </select>
                              <img src="./assets/Icons/bed.svg" alt="" style="position: absolute; padding: 13px 25px;">
                              <select id="beds" class="user-icon pankaj-tag" [(ngModel)]="requestParams.bed" name="beds"
                                (change)="reloadBookingFare()">
                                <option [ngValue]="1">1</option>
                                <option [ngValue]="2">2</option>
                                <option [ngValue]="3">3</option>
                              </select>
                            </div>
                          </div>

                          <div class="contact-info basic-details">
                            <div class="d-flex align-items-center">
                              <select id="title" style="width: 67px;" class="pankaj-tag" name="title">
                                <option value="title">Title</option>
                                <option value="title">Mr.</option>
                                <option value="title">Mrs.</option>
                              </select>
                              <input type="text" placeholder="First name" name="fname"
                                class="input-text input-text-field required p-0"
                                [(ngModel)]="requestParams.res_guest[0].guest.personal_contact.first_name" required>
                              <input type="text" placeholder="Last name" name="lname"
                                class="input-text input-text-field p-0"
                                [(ngModel)]="requestParams.res_guest[0].guest.personal_contact.last_name" required>
                            </div>
                            <div class="contact basic-details-email">
                              <div class="d-flex align-items-center">
                                <input type="text" placeholder="Phone" name="phone" style="width: 182px;"
                                  class="input-text-field p-0"
                                  [(ngModel)]="requestParams.res_guest[0].guest.personal_contact.phone" required>
                                <img src="./assets/Icons/phone.svg" alt="">
                                <img src="./assets/Icons/email.svg" alt=""
                                  style="background: #1C1B1F1F; margin-left: 5px;">
                                <input type="text" placeholder="Email" name="email"
                                [(ngModel)]="requestParams.res_guest[0].guest.personal_contact.email"
                                  style="width: 367px; margin-left: 5px;" class="input-text-field p-0">
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="footer">
                        <div class="price-info popup-body-pay-size"
                          style="display: flex; justify-content: space-between; width: 100%; flex-direction: row!important; padding:10px;">
                          <span class="Guarantee-text">Guarantee / Deposit</span>
                          <div class="price">
                            <span class="total-price">$ {{finalAmount}}</span>
                            <span class="sub-price">$ {{roomfare}}</span>
                          </div>
                        </div>
                      </div>
                      <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="buttons button-margin">
                          <button class="hold-btn">Hold</button>
                          <button class="temp-reserve-btn">Temp Reservation</button>
                          <button class="reserve-btn" (click)="bookingReservation()">Reserve</button>
                          <button class="checkin-btn">Check-in</button>
                        </div>
                        <div class="button-margin">
                          <a class="anchor-tag" (click)="bookingReservation()" (click)="addNewTab('Single')">Single</a>
                          <a class="anchor-tag" (click)="bookingReservation()" (click)="addNewTab('Group')">Group</a>
                          <a class="anchor-tag" (click)="bookingReservation()" (click)="addNewTab('Agent')">Agent / Corporate</a>
                        </div>
                      </div>
                    </div>
                  </ng-template>
                  <ng-template #resourceHeaderTemplate let-data>
                    <div class='template-wrap'>
                      <div class="airline-details" style="display: flex; align-items: center; gap:10px">
                        <div>
                          <ejs-checkbox 
                          name="ejscheckbox"
                          *ngIf="data.resourceData.ClassName !== 'e-parent-node'"
                          [checked]="isRoomSelected(data.resourceData.Id, data.resourceData.DepartmentId)"
                          (change)="onRoomSelectionChange(data.resourceData, $event.checked, data.resourceData.DepartmentId)">
                        </ejs-checkbox>
                
                        </div>
                        <div class="resource-name">{{getResourceName(data)}}</div>
                      </div>
                    </div>
                  </ng-template>
                  <ng-template #dateHeaderTemplate let-data>
                    <div class="date-text d-flex justify-center flex-column">
                      <div class="chead">{{ getDateParts(data.date).day }}</div>
                      <div>{{ getDateParts(data.date).abbreviated}}</div>
                    </div>
                  </ng-template>
