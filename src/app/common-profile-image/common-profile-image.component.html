
  <div class="col-lg-12 control-section-image">
    <div class=" e-hide">
      <div class="e-custom-wrapper">
        <canvas id="img-canvas" style="max-width: 200px; height: 100px;"></canvas>
        <img alt="img" id="demo-img" crossorigin="anonymous"  src="./assets/images/NoutGolstein.png"
        style="display: none;" (load)="imageLoaded()"/>
        <input type="file" id="img-upload" (change)="imageChanged($event)" style="display:none" accept="image/*"/>
        <span id="custom-edit" class="e-custom-edit" (click)="canvasClicked()">
            <span class="speeddial-icons speeddial-icon-edit"></span>
        </span>
      </div>    
    </div>
    <div class="e-img-editor-sample" id="profile-dialog">
        <ejs-dialog [position]="position" #Dialog [buttons]='dlgButtons' [visible]='visible' [header]='header' [showCloseIcon]='showCloseIcon' [target]='target' [width]='width' [height]='height' (open)="dialogOpen()" (close)="dialogClose()" style="    left: 0px !important;
    top: 60px !important;" >
        <ng-template #content>
            <ejs-imageeditor #ImageEditor [toolbar]='toolbarItems' (created)="created()" (fileOpened)="fileOpened()"> </ejs-imageeditor>
        </ng-template>
    </ejs-dialog>
    </div>
  </div>
